name: 朝の売買シグナル

on:
  schedule:
    # 平日の朝6時40分（日本時間）に実行。GitHubの時計はUTCなので9時間引いて書いています
    - cron: "40 21 * * 0-4"
  workflow_dispatch: # 手動で今すぐ実行するボタン

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 必要なものをインストール
        run: pip install yfinance pandas numpy

      - name: シグナルを判定
        run: python signals.py

      - name: 結果を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "シグナル更新 $(TZ=Asia/Tokyo date +'%Y-%m-%d')" || echo "変更なし"
          git push
